<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم | أكاديمية صُنّاع الوعي</title>
  <link rel="preconnect" href="https://googleapis.com" />
  <link href="https://googleapis.comcss2?family=Tajawal:wght@300;400;500;700;800;900&amp;family=Cairo:wght@300;400;600;700;900&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cloudflare.com" />
  <script src="https://jsdelivr.net"></script>
  <style>
    :root {
      --primary: #1a1a2e;
      --secondary: #16213e;
      --accent: #e94560;
      --gold: #f0a500;
      --teal: #0f9b8e;
      --sidebar-w: 260px;
      --white: #fff;
      --light-bg: #f0f2f8;
      --text-dark: #1a1a2e;
      --text-gray: #6b7280;
      --border: #e5e7eb;
      --card-bg: #ffffff;
      --shadow: 0 2px 12px rgba(26,26,46,0.08);
      --shadow-lg: 0 8px 32px rgba(26,26,46,0.14);
      --radius: 14px;
      --gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      --gradient-accent: linear-gradient(135deg, #e94560 0%, #c62a47 100%);
      --gradient-gold: linear-gradient(135deg, #f0a500 0%, #e07b00 100%);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Tajawal', 'Cairo', sans-serif;
      direction: rtl;
      background: var(--light-bg);
      color: var(--text-dark);
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: var(--sidebar-w);
      background: var(--gradient);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
    }

    .sidebar-logo {
      padding: 24px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-logo-icon {
      width: 40px; height: 40px;
      background: var(--gradient-accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 14px rgba(233,69,96,0.35);
      color: #fff;
    }

    .sidebar-logo-text .t1 {
      color: #fff; font-size: 14px; font-weight: 800; display: block; line-height: 1.2;
    }
    .sidebar-logo-text .t2 {
      color: var(--gold); font-size: 10px; font-weight: 500;
    }

    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      overflow-y: auto;
    }

    .sidebar-nav-group {
      margin-bottom: 8px;
    }

    .nav-group-label {
      color: rgba(255,255,255,0.35);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 8px 12px 4px;
    }

    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 10px;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-bottom: 2px;
    }

    .sidebar-nav-item:hover {
      background: rgba(255,255,255,0.08);
      color: var(--white);
    }

    .sidebar-nav-item.active {
      background: var(--gradient-accent);
      color: var(--white);
      box-shadow: 0 4px 14px rgba(233,69,96,0.3);
    }

    .sidebar-nav-item i {
      width: 18px;
      text-align: center;
      font-size: 15px;
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar-footer a {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,0.55);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 8px;
      transition: all 0.3s;
      text-decoration: none;
    }

    .sidebar-footer a:hover {
      background: rgba(255,255,255,0.08);
      color: var(--white);
    }

    .main-content {
      margin-right: var(--sidebar-w);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: var(--white);
      padding: 0 28px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-dark);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-btn {
      padding: 8px 18px;
      background: var(--gradient-accent);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      transition: all 0.3s;
    }

    .topbar-btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .page-content {
      padding: 28px;
      flex: 1;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0; left: 0;
      height: 3px;
    }
    .stat-card.red::before { background: var(--gradient-accent); }
    .stat-card.gold::before { background: var(--gradient-gold); }
    .stat-card.teal::before { background: linear-gradient(135deg, #0f9b8e, #007a72); }
    .stat-card.blue::before { background: linear-gradient(135deg, #3b82f6, #2563eb); }

    .stat-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      margin-bottom: 16px;
    }
    .stat-card.red .stat-icon { background: rgba(233,69,96,0.1); color: var(--accent); }
    .stat-card.gold .stat-icon { background: rgba(240,165,0,0.1); color: var(--gold); }
    .stat-card.teal .stat-icon { background: rgba(15,155,142,0.1); color: var(--teal); }
    .stat-card.blue .stat-icon { background: rgba(59,130,246,0.1); color: #3b82f6; }

    .stat-value {
      font-size: 32px;
      font-weight: 900;
      color: var(--text-dark);
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-label {
      font-size: 14px;
      color: var(--text-gray);
      font-weight: 500;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .card-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .card-body {
      padding: 22px;
    }

    @media (max-width: 1024px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .content-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(100%); }
      .main-content { margin-right: 0; }
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
      <div class="sidebar-logo-text">
        <span class="t1">صُنّاع الوعي</span>
        <span class="t2">لوحة التحكم</span>
      </div>
    </div>
    
    <div class="sidebar-nav">
      <div class="sidebar-nav-group">
        <div class="nav-group-label">الرئيسية</div>
        <div class="sidebar-nav-item active"><i class="fa-solid fa-chart-pie"></i> الإحصائيات العامة</div>
        <div class="sidebar-nav-item"><i class="fa-solid fa-book-open"></i> الكورسات والدورات</div>
        <div class="sidebar-nav-item"><i class="fa-solid fa-users"></i> الطلاب المشتركين</div>
      </div>
    </div>

    <div class="sidebar-footer">
      <a href="#"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</a>
    </div>
  </div>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-right">
        <h1 class="topbar-title">أهلاً بك مجدداً 👋</h1>
      </div>
      <div class="topbar-left">
        <button class="topbar-btn">ملفي الشخصي</button>
      </div>
    </div>

    <div class="page-content">
      
      <div class="stats-grid">
        <div class="stat-card red">
          <div class="stat-icon"><i class="fa-solid fa-user-graduate"></i></div>
          <div class="stat-value">1,240</div>
          <div class="stat-label">إجمالي الطلاب</div>
        </div>
        <div class="stat-card gold">
          <div class="stat-icon"><i class="fa-solid fa-video"></i></div>
          <div class="stat-value">48</div>
          <div class="stat-label">الدورات الحالية</div>
        </div>
        <div class="stat-card teal">
          <div class="stat-icon"><i class="fa-solid fa-wallet"></i></div>
          <div class="stat-value">$3,400</div>
          <div class="stat-label">الأرباح الكلية</div>
        </div>
        <div class="stat-card blue">
