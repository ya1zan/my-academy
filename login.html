<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أكاديمية صناع الوعي - تسجيل الدخول</title>
  
  <!-- استدعاء خط Cairo بشكل صحيح من Google Fonts -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    
    body { 
      background-color: #0f172a; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 20px; 
    }

    .login-card { 
      background: #1e293b; 
      width: 100%; 
      max-width: 400px; 
      padding: 40px 30px; 
      border-radius: 12px; 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); 
      text-align: center;
      border: 1px solid rgba(212, 175, 55, 0.1);
    }

    h2 { color: #ffffff; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .sub { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
    
    .form-group { text-align: right; margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #f8fafc; font-weight: 700; }

    .form-group input { 
      width: 100%; 
      padding: 12px 16px; 
      border: 1px solid #475569; 
      border-radius: 8px; 
      background: #0f172a; 
      color: #ffffff;
      font-size: 14px; 
      outline: none; 
    }

    .form-group input:focus { border-color: #d4af37; }
    ::placeholder { color: #475569; }
    
    .btn-action { 
      width: 100%; 
      padding: 12px; 
      background: #0f2b46; 
      color: #d4af37; 
      border: 2px solid #d4af37; 
      border-radius: 8px; 
      font-size: 16px; 
      font-weight: 700; 
      cursor: pointer; 
      transition: 0.2s;
    }

    .btn-action:hover { background: #d4af37; color: #0f2b46; }
    
    .footer-link { display: inline-block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 13px; }
    .footer-link:hover { color: #d4af37; }
    
    .error-div { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; text-align: right; font-weight: bold; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>أكاديمية صُنّاع الوعي</h2>
    <div class="sub">لوحة التحكم – تسجيل الدخول</div>
    
    <form id="loginForm">
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="أدخل البريد الإلكتروني" required>
      </div>

      <div class="form-group">
        <label>كلمة运行</label>
        <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
      </div>

      <button type="submit" class="btn-action">تسجيل الدخول</button>
      
      <div id="errorLocation" class="error-div"></div>
    </form>

    <a href="#" class="footer-link">نسيت كلمة المرور؟</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getAuth, signInWithEmailAndPassword } from "https://gstatic.com";

    // إعدادات الفايربيس الصحيحة الخاصة بمشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyBcDDH3eK31d_YRcw9T7EKvQsVu1AxVQ4U",
      authDomain: "://firebaseapp.com",
      projectId: "my-academy-deb07",
      storageBucket: "my-academy-deb07.firebasestorage.app",
      messagingSenderId: "353925836983",
      appId: "1:353925836983:web:48e4b2ad4544a76e065d32",
      measurementId: "G-DCGMMNBK0G"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorLocation');

      errorDiv.style.display = "none";

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          console.log("تم تسجيل الدخول بنجاح! جاري التوجيه...");
          window.location.href = "index.html"; // التوجيه للوحة التحكم
        })
        .catch((error) => {
          console.error("حدث خطأ أثناء تسجيل الدخول:", error.code, error.message);
          
          // رسالة خطأ واضحة للمستخدم
          errorDiv.innerText = "عذراً، البريد الإلكتروني أو كلمة المرور غير صحيحة!";
          errorDiv.style.display = "block";
        });
    });
  </script>
</body>
</html>
