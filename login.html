<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - تسجيل الدخول | أكاديمية صُنّاع الوعي</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="https://cloudflare.com">
  <style>
    :root {
      --bg-dark: #1e2538;
      --card-bg: #262f45;
      --accent: #e94560;
      --text-white: #ffffff;
      --text-muted: #8b9bb4;
      --border-color: #384563;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
    
    body { 
      background-color: var(--bg-dark); 
      background-image: linear-gradient(rgba(56, 69, 99, 0.15) 1px, transparent 1px), linear-gradient(90deg, rgba(56, 69, 99, 0.15) 1px, transparent 1px);
      background-size: 20px 20px;
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 20px; 
    }
    
    .login-box { 
      background: var(--card-bg); 
      width: 100%; 
      max-width: 420px; 
      padding: 40px 30px; 
      border-radius: 16px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.25); 
      text-align: center;
      border: 1px solid var(--border-color);
    }
    
    .logo-area {
      width: 70px; height: 70px;
      background: linear-gradient(135deg, #e94560 0%, #c62a47 100%);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 4px 15px rgba(233,69,96,0.4);
    }

    .logo-area svg {
      width: 42px; height: 42px;
      fill: #ff8fa3;
    }
    
    h2 { color: var(--text-white); font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 30px; }
    
    .form-group { text-align: right; margin-bottom: 22px; position: relative; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: var(--text-white); }
    
    .input-wrapper { position: relative; display: flex; align-items: center; }
    .input-wrapper i { position: absolute; right: 16px; color: var(--text-muted); font-size: 16px; }
    
    .form-group input { 
      width: 100%; 
      padding: 14px 44px 14px 16px; 
      border: 1px solid var(--border-color); 
      border-radius: 10px; 
      background: #1d2436; 
      color: var(--text-white);
      font-size: 14px; 
      transition: all 0.3s; 
      outline: none; 
    }
    
    .form-group input:focus { border-color: var(--accent); background: #222a3f; box-shadow: 0 0 8px rgba(233,69,96,0.2); }
    ::placeholder { color: #53647e; }
    
    .btn-submit { 
      width: 100%; 
      padding: 14px; 
      background: linear-gradient(135deg, #e94560 0%, #c62a47 100%); 
      color: #fff; 
      border: none; 
      border-radius: 10px; 
      font-size: 15px; 
      font-weight: 700; 
      cursor: pointer; 
      transition: all 0.3s; 
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 14px rgba(233,69,96,0.3);
      margin-top: 10px;
    }
    
    .btn-submit:hover { transform: translateY(-1px); opacity: 0.95; box-shadow: 0 6px 20px rgba(233,69,96,0.4); }
    
    .back-link { display: inline-block; margin-top: 25px; color: var(--text-muted); text-decoration: none; font-size: 13px; transition: 0.3s; }
    .back-link:hover { color: var(--accent); }
    
    .error-msg { color: #ff5252; font-size: 13px; margin-top: 10px; display: none; text-align: right; font-weight: bold; }
  </style>
</head>
<body>

  <div class="login-box">
    <!-- الشعار الذكي المطابق لشكل الدماغ واللون -->
    <div class="logo-area">
      <svg viewBox="0 0 24 24">
        <path d="M12,3c-0.4,0-0.8,0-1.1,0.1C9.6,3.4,8.5,4.5,8.2,5.8C7.5,5.6,6.7,5.6,6,6C4.6,6.8,3.9,8.4,4.2,10c-0.7,0.3-1.2,1-1.2,1.8c0,1,0.7,1.8,1.6,2c-0.1,0.4-0.1,0.8,0,1.2c0.3,1.4,1.4,2.5,2.8,2.8c0.2,0.6,0.6,1.1,1.2,1.5c0.9,0.6,2.1,0.7,3.1,0.3c0.3,0.3,0.8,0.4,1.3,0.4c0.5,0,0.9-0.1,1.3-0.4c1,0.4,2.2,0.3,3.1-0.3c0.6-0.4,1-0.9,1.2-1.5c1.4-0.3,2.5-1.4,2.8-2.8c0.1-0.4,0.1-0.8,0-1.2c0.9-0.2,1.6-1,1.6-2c0-0.8-0.5-1.5-1.2-1.8c0.3-1.6-0.4-3.2-1.8-4c-0.7-0.4-1.5-0.4-2.2-0.2c-0.3-1.3-1.4-2.4-2.7-2.7C12.8,3,12.4,3,12,3z M11,5.1V12H5.1C5,11.7,5,11.3,5.1,11C5.3,9.8,6.2,8.8,7.4,8.6l0.8-0.1l0.1-0.8c0.2-1.2,1.2-2.2,2.4-2.4C10.8,5.2,10.9,5.1,11,5.1z M13,5.1c0.1,0,0.2,0.1,0.3,0.2c1.2,0.2,2.2,1.2,2.4,2.4l0.1,0.8l0.8,0.1c1.2,0.2,2.1,1.2,2.3,2.4c0.1,0.3,0.1,0.7,0.1,1H13V5.1z M5.1,13H11v6.9c-0.1,0-0.2-0.1-0.3-0.2c-1.2-0.2-2.2-1.2-2.4-2.4l-0.1-0.8l-0.8-0.1c-1.2-0.2-2.1-1.2-2.3-2.4C5.1,13.7,5.1,13.3,5.1,13z M13,13h5.9c0,0.3,0,0.7-0.1,1c-0.2,1.2-1.1,2.2-2.3,2.4l-0.8,0.1l-0.1,0.8c-0.2,1.2-1.2,2.2-2.4,2.4c-0.1,0.1-0.2,0.2-0.3,0.2V13z"/>
      </svg>
    </div>
    <h2>أكاديمية صُنّاع الوعي</h2>
    <div class="subtitle">لوحة التحكم – تسجيل الدخول</div>
    
    <form id="loginForm">
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" placeholder="أدخل البريد الإلكتروني" required>
        </div>
      </div>
      
      <div class="form-group">
        <label>كلمة المرور</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
        </div>
      </div>
      
      <div id="errorLocation" class="error-msg"></div>
      
      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-right-to-bracket"></i> دخول للوحة التحكم
      </button>
    </form>
    
    <a href="index.html" class="back-link">← العودة للموقع الرئيسي</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getAuth, signInWithEmailAndPassword } from "https://gstatic.com";

    const firebaseConfig = {
      apiKey: "AIzaSyBcDDH3eK31d_YRcw9T7EKvQsVu1AxVQ4U",
      authDomain: "my-academy-deb07.firebaseapp.com",
      projectId: "my-academy-deb07",
      storageBucket: "my-academy-deb07.firebasestorage.app",
      messagingSenderId: "353925836983",
      appId: "1:353925836983:web:48e4b2ad4544a76e065d32",
      measurementId: "G-DCGMMNBK0G"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorLocation');

      errorDiv.style.display = "none";

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          window.location.href = "index.html";
        })
        .catch((error) => {
          errorDiv.innerText = "عذراً، البريد الإلكتروني أو كلمة المرور غير صحيحة!";
          errorDiv.style.display = "block";
        });
    });
  </script>
</body>
</html>
