<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | أكاديمية صُنّاع الوعي</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="https://cloudflare.com">
  <style>
    :root {
      --primary: #1a1a2e;
      --secondary: #16213e;
      --accent: #e94560;
      --white: #fff;
      --light-bg: #f0f2f8;
      --text-dark: #1a1a2e;
      --border: #e5e7eb;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
    body { background: var(--light-bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .login-container { background: var(--white); width: 100%; max-width: 450px; padding: 40px; border-radius: 16px; box-shadow: 0 8px 32px rgba(26,26,46,0.08); border: 1px solid var(--border); text-align: center; }
    .logo-icon { width: 60px; height: 60px; background: linear-gradient(135deg, #e94560 0%, #c62a47 100%); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; margin: 0 auto 20px; box-shadow: 0 4px 14px rgba(233,69,96,0.35); }
    h2 { color: var(--text-dark); margin-bottom: 8px; font-weight: 800; }
    p { color: #6b7280; font-size: 14px; margin-bottom: 30px; }
    .input-group { position: relative; margin-bottom: 20px; text-align: right; }
    .input-group label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: var(--text-dark); }
    .input-group i { position: absolute; right: 16px; bottom: 14px; color: #9ca3af; }
    .input-group input { width: 100%; padding: 12px 44px 12px 16px; border: 1px solid var(--border); border-radius: 10px; background: #f9fafb; font-size: 14px; transition: all 0.3s; outline: none; }
    .input-group input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(233,69,96,0.1); }
    .btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, #e94560 0%, #c62a47 100%); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 14px rgba(233,69,96,0.2); }
    .btn-login:hover { transform: translateY(-1px); opacity: 0.95; }
    .error-msg { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; text-align: right; font-weight: bold; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
    <h2>أكاديمية صُنّاع الوعي</h2>
    <p>مرحباً بك! يرجى تسجيل الدخول للوصول لحسابك</p>
    
    <form id="loginForm">
      <div class="input-group">
        <label>البريد الإلكتروني</label>
        <i class="fa-solid fa-envelope"></i>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>
      <div class="input-group">
        <label>كلمة المرور</label>
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <div id="errorLocation" class="error-msg"></div>
      <button type="submit" class="btn-login">تسجيل الدخول</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getAuth, signInWithEmailAndPassword } from "https://gstatic.com";

    // كود الربط الكامل والحقيقي التابع لأكاديميتك
    const firebaseConfig = {
      apiKey: "AIzaSyBcDDH3eK31d_YRcw9T7EKvQsVu1AxVQ4U",
      authDomain: "my-academy-deb07.firebaseapp.com",
      projectId: "my-academy-deb07",
      storageBucket: "my-academy-deb07.firebasestorage.app",
      messagingSenderId: "353925836983",
      appId: "1:353925836983:web:48e4b2ad4544a76e065d32",
      measurementId: "G-DCGMMNBK0G"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorLocation');

      errorDiv.style.display = "none";

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          // دخول ناجح للوحة الإدارة والطلاب
          window.location.href = "index.html";
        })
        .catch((error) => {
          errorDiv.innerText = "عذراً، البريد الإلكتروني أو كلمة المرور غير صحيحة!";
          errorDiv.style.display = "block";
        });
    });
  </script>
</body>
</html>
